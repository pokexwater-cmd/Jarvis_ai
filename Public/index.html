<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f1f4f1;
    --surface: #ffffff;
    --ink: #1b2a2f;
    --muted: #66787d;
    --user: #1f6f6b;
    --user-ink: #ffffff;
    --bot: #e2e9e5;
    --line: #d5ded9;
    --signal: #e8a33d;
    --err: #b3412f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #11191b;
      --surface: #182224;
      --ink: #e6eeea;
      --muted: #8da0a4;
      --user: #2a8c86;
      --user-ink: #ffffff;
      --bot: #223033;
      --line: #2c3c3f;
      --err: #ef8a76;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--signal); flex: none; }
  h1 {
    margin: 0;
    font-family: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  header small { color: var(--muted); margin-left: auto; font-size: 13px; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    scroll-behavior: smooth;
  }
  .m {
    max-width: 82%;
    padding: 10px 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    border-radius: 18px;
  }
  .u { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 5px; }
  .b { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 5px; }
  .b.err { color: var(--err); background: transparent; border: 1px solid var(--err); }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 280px; }
  .empty strong {
    display: block;
    color: var(--ink);
    font-family: "Bricolage Grotesque", "Figtree", sans-serif;
    font-size: 26px;
    line-height: 1.15;
    margin-bottom: 8px;
  }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .note { font-size: 13px; color: var(--muted); margin-top: 4px; }
  form {
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .row { display: flex; gap: 8px; align-items: flex-end; max-width: 720px; margin: 0 auto; }
  textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 11px 14px;
    font: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  textarea::placeholder { color: var(--muted); }
  button {
    flex: none;
    height: 44px;
    padding: 0 20px;
    font: inherit;
    font-weight: 600;
    color: var(--user-ink);
    background: var(--user);
    border: 0;
    border-radius: 22px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    #log { scroll-behavior: auto; }
    .typing i { animation: none; opacity: .6; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" aria-hidden="true"></span>
  <h1>Jarvis</h1>
  <small>Remembers what you tell it</small>
</header>

<main id="log" aria-live="polite">
  <div class="empty" id="empty">
    <strong>Tell me something worth remembering.</strong>
    Your name, your projects, how you like answers. I'll keep it for next time.
  </div>
</main>

<form id="f">
  <div class="row">
    <textarea id="t" rows="1" placeholder="Message Jarvis" aria-label="Message"></textarea>
    <button id="s" type="submit">Send</button>
  </div>
</form>

<script>
let id = null;
try { id = localStorage.getItem("sid"); } catch (e) {}
if (!id) {
  id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random();
  try { localStorage.setItem("sid", id); } catch (e) {}
}

const log = document.getElementById("log");
const t = document.getElementById("t");
const s = document.getElementById("s");
const f = document.getElementById("f");
const empty = document.getElementById("empty");

function add(cls, text) {
  if (empty) empty.remove();
  const d = document.createElement("div");
  d.className = "m " + cls;
  if (text) d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function grow() {
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 140) + "px";
}
t.addEventListener("input", grow);

t.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover: hover)").matches) {
    e.preventDefault();
    f.requestSubmit();
  }
});

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const m = t.value.trim();
  if (!m || s.disabled) return;
  t.value = "";
  grow();
  s.disabled = true;
  add("u", m);

  const w = add("b");
  w.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  const slow = setTimeout(() => {
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = "Waking up the server. The first reply can take up to a minute.";
    w.appendChild(n);
  }, 6000);

  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: id, message: m }),
    });
    const d = await r.json();
    if (!r.ok || !d.reply) throw new Error();
    w.textContent = d.reply;
  } catch (err) {
    w.className = "m b err";
    w.textContent = "Couldn't get a reply. Check your connection and send it again.";
  } finally {
    clearTimeout(slow);
    s.disabled = false;
    log.scrollTop = log.scrollHeight;
    t.focus();
  }
});
</script>
</body>
</html>
