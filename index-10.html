<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Chatbot</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #111; color: #eee; }
  #log { flex: 1; overflow-y: auto; padding: 12px; }
  .m { margin: 8px 0; padding: 10px 12px; border-radius: 10px; max-width: 80%; white-space: pre-wrap; }
  .u { background: #2a5; margin-left: auto; }
  .b { background: #333; }
  #bar { display: flex; gap: 8px; padding: 10px; background: #1a1a1a; }
  #t { flex: 1; padding: 10px; border-radius: 8px; border: 0; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2a5; color: #fff; }
</style>
</head>
<body>
<div id="log"></div>
<div id="bar"><input id="t" placeholder="Type a message..."><button id="s">Send</button></div>
<script>
let id = localStorage.getItem("sid");
if (!id) { id = crypto.randomUUID(); localStorage.setItem("sid", id); }
const log = document.getElementById("log"), t = document.getElementById("t");
function add(c, x) { const d = document.createElement("div"); d.className = "m " + c; d.textContent = x; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
async function send() {
  const m = t.value.trim(); if (!m) return;
  t.value = ""; add("u", m);
  const w = add("b", "...");
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionId: id, message: m }) });
    const d = await r.json(); w.textContent = d.reply || "Error";
  } catch { w.textContent = "Error"; }
}
document.getElementById("s").onclick = send;
t.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
